<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Congratulations!</title>
    <style>
      :root {
        --primary-gold: #FFCC00;
        --primary-gold-dark: #F5A623;
        --outline-blue: #1E90FF;
        --outline-blue-dark: #0066CC;
        --background-color: #f5f5f7;
        --shadow-color: rgba(0, 0, 0, 0.2);
        
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;

        color-scheme: light;
        background-color: var(--background-color);
        
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @keyframes gradientAnimation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      body {
        margin: 0;
        display: flex;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(
          -45deg,
          #ee7752,
          #e73c7e,
          #23a6d5,
          #23d5ab
        );
        background-size: 400% 400%;
        animation: gradientAnimation 15s ease infinite;
      }

      #app {
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        padding: 2rem;
        text-align: center;
      }

      .congratulation-container {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        min-height: 60vh;
      }

      .text-container {
        position: relative;
        z-index: 20;
      }

      .congratulation-text {
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--primary-gold);
        text-shadow: 
          -3px -3px 0 var(--outline-blue),
          3px -3px 0 var(--outline-blue),
          -3px 3px 0 var(--outline-blue),
          3px 3px 0 var(--outline-blue),
          0 4px 6px var(--shadow-color);
        animation: textPulse 2s infinite ease-in-out;
      }

      .stars-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }

      .star {
        position: absolute;
        background-color: var(--primary-gold);
        clip-path: polygon(
          50% 0%, 61% 35%, 98% 35%, 68% 57%, 
          79% 91%, 50% 70%, 21% 91%, 32% 57%, 
          2% 35%, 39% 35%
        );
        z-index: 15;
        transform-origin: center;
      }

      .message-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 2rem;
        margin-top: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 90%;
        z-index: 30;
        position: relative;
      }

      .message-title {
        color: #FF4B4B;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .message-text {
        color: #333;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      @keyframes textPulse {
        0% {
          transform: scale(1);
          text-shadow: 
            -3px -3px 0 var(--outline-blue),
            3px -3px 0 var(--outline-blue),
            -3px 3px 0 var(--outline-blue),
            3px 3px 0 var(--outline-blue),
            0 4px 6px var(--shadow-color);
        }
        50% {
          transform: scale(1.05);
          text-shadow: 
            -4px -4px 0 var(--outline-blue-dark),
            4px -4px 0 var(--outline-blue-dark),
            -4px 4px 0 var(--outline-blue-dark),
            4px 4px 0 var(--outline-blue-dark),
            0 6px 10px var(--shadow-color);
        }
        100% {
          transform: scale(1);
          text-shadow: 
            -3px -3px 0 var(--outline-blue),
            3px -3px 0 var(--outline-blue),
            -3px 3px 0 var(--outline-blue),
            3px 3px 0 var(--outline-blue),
            0 4px 6px var(--shadow-color);
        }
      }

      @keyframes starFloat {
        0% {
          transform: translate(0, 0) scale(0) rotate(0deg);
          opacity: 1;
        }
        80% {
          opacity: 0.8;
        }
        100% {
          transform: translate(var(--tx), var(--ty)) scale(var(--scale)) rotate(var(--rotation));
          opacity: 0;
        }
      }

      @keyframes starBurst {
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }

      @media (max-width: 768px) {
        #app {
          padding: 1rem;
        }
        
        .congratulation-text {
          font-size: clamp(2rem, 7vw, 4rem);
          text-shadow: 
            -2px -2px 0 var(--outline-blue),
            2px -2px 0 var(--outline-blue),
            -2px 2px 0 var(--outline-blue),
            2px 2px 0 var(--outline-blue),
            0 3px 4px var(--shadow-color);
        }

        .message-container {
          padding: 1.5rem;
        }

        .message-title {
          font-size: 1.25rem;
        }

        .message-text {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="congratulation-container">
        <div class="stars-container" id="starsContainer"></div>
        <div class="text-container">
          <h1 class="congratulation-text">CONGRATULATION</h1>
        </div>
        <div class="message-container">
          <h2 class="message-title">YOU FAILED THE PHISHING TEST!!!</h2>
          <p class="message-text">
            <b>You've just participated in a Phishing Awareness Test</b><br><br>
            This was <b>not</b> a real phishing attack but a <b>simulated</b> test to help you recognize and avoid malicious emails or links.
          </p>
        </div>
      </div>
    </div>
    <script>
      // Configuration for star generation
      const config = {
        minSize: 10,
        maxSize: 40,
        minDuration: 2,
        maxDuration: 4,
        colors: ['#FFCC00', '#FFD700', '#FFC107', '#F5A623']
      };

      // Store all active stars
      let stars = [];

      function getRandomValue(min, max) {
        return min + Math.random() * (max - min);
      }

      function generateStars(count) {
        const container = document.getElementById('starsContainer');
        
        for (let i = 0; i < count; i++) {
          // Create star element
          const star = document.createElement('div');
          star.classList.add('star');
          
          // Set random size
          const size = getRandomValue(config.minSize, config.maxSize);
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          
          // Set random position at center
          star.style.left = '50%';
          star.style.top = '50%';
          star.style.transform = 'translate(-50%, -50%)';
          
          // Set random color
          const color = config.colors[Math.floor(Math.random() * config.colors.length)];
          star.style.backgroundColor = color;
          
          // Set random animation properties
          const duration = getRandomValue(config.minDuration, config.maxDuration);
          const angle = Math.random() * Math.PI * 2; // Random angle in radians
          const distance = 100 + Math.random() * 200; // Random distance
          
          // Calculate end position using angle and distance
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          
          // Set animation variables
          star.style.setProperty('--tx', `${tx}px`);
          star.style.setProperty('--ty', `${ty}px`);
          star.style.setProperty('--scale', 0.5 + Math.random() * 1.5);
          star.style.setProperty('--rotation', `${getRandomValue(-720, 720)}deg`);
          
          // Apply animation
          star.style.animation = `starFloat ${duration}s ease-out forwards`;
          
          // Add to container
          container.appendChild(star);
          
          // Add to tracking array with removal callback
          stars.push({
            element: star,
            removeAt: Date.now() + duration * 1000
          });
        }
      }

      function animateStars() {
        const now = Date.now();
        
        // Remove expired stars
        stars = stars.filter(star => {
          if (now >= star.removeAt) {
            star.element.remove();
            return false;
          }
          return true;
        });
        
        // Continue animation loop
        requestAnimationFrame(animateStars);
      }

      function createStarburst() {
        const starburst = document.createElement('div');
        starburst.classList.add('starburst');
        document.getElementById('starsContainer').appendChild(starburst);
      }

      function setupPage() {
        // Create starburst effect element
        createStarburst();
        
        // Generate initial stars
        generateStars(5);
        
        // Start continuous star animation
        setInterval(() => {
          generateStars(1);
        }, 800);
        
        // Start animation loop
        requestAnimationFrame(animateStars);
      }

      // Initialize the page
      document.addEventListener('DOMContentLoaded', () => {
        setupPage();
      });
    </script>
  </body>
</html>
